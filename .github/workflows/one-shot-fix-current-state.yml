name: one-shot-fix-current-state

on:
  push:
    branches:
      - claude/dazzling-dirac-vvz5rz

permissions:
  contents: write

jobs:
  patch-current-state:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: claude/dazzling-dirac-vvz5rz
          fetch-depth: 0

      - name: Replace stale Turnstile current-state section
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          path = Path('docs/CURRENT-STATE.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## Bot verification on the lead path — MERGED, NOT CONFIGURED, NOT ENFORCING'
          end_marker = "## The lead path's body read — bounded in size AND in time"

          if text.count(start_marker) != 1:
              raise SystemExit(f'expected exactly one stale Turnstile section header, found {text.count(start_marker)}')
          if text.count(end_marker) != 1:
              raise SystemExit(f'expected exactly one next-section header, found {text.count(end_marker)}')

          replacement = base64.b64decode('').decode('utf-8')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT-STATE.md
          git rm .github/workflows/one-shot-fix-current-state.yml
          git diff --cached --check
          git commit -m 'docs: align current state with final Turnstile model'
          git push origin HEAD:claude/dazzling-dirac-vvz5rz
