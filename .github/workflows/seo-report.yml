name: SEO snapshot

# Weekly, Monday 11:00 UTC, roughly 07:00 in Toledo, so a snapshot is
# waiting before STRATEGY.md's Monday market-review block rather than
# landing in the middle of it.
#
# The window the script asks for always ends three days back, because
# Search Console does not finalise a day's figures for two to three days.
# A Monday run therefore covers through the previous Friday.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days to cover (default 28)"
        required: false
        default: "28"

# A weekly run can take several minutes because the snapshot PR must pass the
# repository's real test gate before it can merge. Never cancel one halfway
# through and leave an ambiguous branch/PR behind.
concurrency:
  group: seo-report
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    # main is protected by the Protect Main ruleset. This workflow therefore
    # writes the snapshot on a topic branch, opens a PR, explicitly dispatches
    # the required `test` workflow for that commit, waits for it to pass, and
    # merges only through the PR. No ruleset bypass is used.
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Until the one-time Google setup in docs/seo/README.md is done there
      # are no credentials to run with. This stops cleanly and says so in
      # the run summary rather than failing every Monday and training
      # everyone to ignore a red badge.
      #
      # It is a SKIP, not a pass: while this branch is taken NO SNAPSHOTS
      # ARE BEING COLLECTED.
      - name: Are credentials configured?
        id: creds
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### SEO snapshot skipped"
              echo
              echo "\`GOOGLE_SERVICE_ACCOUNT_KEY\` is not set on this repository."
              echo "**No snapshots are being collected.**"
              echo
              echo "See \`docs/seo/README.md\` for the one-time setup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the snapshot
        if: steps.creds.outputs.configured == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          SEO_WINDOW_DAYS: ${{ inputs.window_days || '28' }}
        run: |
          npm run seo:report | tee /tmp/seo-summary.txt
          {
            echo '### Search performance'
            echo
            echo '```'
            cat /tmp/seo-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish through the protected-main gate
        if: steps.creds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain docs/seo)" ]; then
            echo "No change under docs/seo. Nothing to publish."
            exit 0
          fi

          THROUGH="$(git status --porcelain docs/seo \
            | sed -n 's|.*docs/seo/\([0-9-]\{10\}\)\.json$|\1|p' \
            | sort | tail -1)"

          if [ -z "$THROUGH" ]; then
            echo "::error::docs/seo changed but no YYYY-MM-DD.json was written"
            git status --porcelain docs/seo
            exit 1
          fi

          BRANCH="automation/seo-snapshot-${THROUGH}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/seo
          git commit \
            -m "Search performance snapshot through ${THROUGH}" \
            -m "Written by .github/workflows/seo-report.yml. Search Console discards performance data after 16 months; these snapshots outlive it."

          SNAPSHOT_SHA="$(git rev-parse HEAD)"
          git push --set-upstream origin "HEAD:${BRANCH}"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Search performance snapshot through ${THROUGH}" \
            --body "Automated weekly Search Console + GA4 snapshot. Generated by the SEO snapshot workflow. The snapshot is merged only after the repository's required test gate passes.")"
          PR_NUMBER="${PR_URL##*/}"

          echo "Created PR #${PR_NUMBER}: ${PR_URL}"

          # PRs created with GITHUB_TOKEN do not reliably trigger other
          # workflows. Dispatch the repository's required test workflow
          # explicitly against this exact snapshot commit instead.
          gh workflow run test.yml --ref "$BRANCH"

          echo "Waiting for required test check on ${SNAPSHOT_SHA}..."
          for attempt in $(seq 1 90); do
            STATUS="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${SNAPSHOT_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "test")] | sort_by(.started_at) | last | (.status // "")')"
            CONCLUSION="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${SNAPSHOT_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "test")] | sort_by(.started_at) | last | (.conclusion // "")')"

            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
              echo "Required test passed."
              break
            fi

            if [ "$STATUS" = "completed" ] && [ -n "$CONCLUSION" ] && [ "$CONCLUSION" != "success" ]; then
              echo "::error::required test finished with conclusion: ${CONCLUSION}"
              echo "Snapshot PR left open for inspection: ${PR_URL}"
              exit 1
            fi

            if [ "$attempt" -eq 90 ]; then
              echo "::error::timed out waiting for required test check"
              echo "Snapshot PR left open for inspection: ${PR_URL}"
              exit 1
            fi

            sleep 10
          done

          # Merge through the normal PR route. The Protect Main ruleset still
          # decides whether the merge is allowed; this command has no bypass.
          gh pr merge "$PR_NUMBER" --merge --delete-branch

          # A merge performed with GITHUB_TOKEN does not necessarily emit a
          # new workflow trigger, so dispatch the diff explicitly after main
          # contains the new snapshot.
          gh workflow run seo-diff.yml --ref main

          {
            echo
            echo "### Snapshot publication"
            echo
            echo "- Snapshot: \`docs/seo/${THROUGH}.json\`"
            echo "- PR: #${PR_NUMBER}"
            echo "- Required test: passed"
            echo "- Merge: completed through protected main"
            echo "- SEO diff: dispatched after merge"
          } >> "$GITHUB_STEP_SUMMARY"
