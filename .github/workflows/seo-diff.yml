name: SEO diff

# The snapshot workflow explicitly dispatches this after its branch-protected
# snapshot PR has merged. A push trigger remains as a safety net for a human
# merge or any other legitimate docs/seo snapshot landing on main.
on:
  push:
    branches: [main]
    paths:
      - "docs/seo/*.json"
  workflow_dispatch:

concurrency:
  group: seo-diff
  cancel-in-progress: false

jobs:
  diff:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Only to raise an issue when something crosses a threshold. This
      # workflow writes nothing to the repository.
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The script writes its whole report to $GITHUB_STEP_SUMMARY and sets
      # `material=true|false`. It never fails the job: "nothing moved" is a
      # result, not an error, and a red badge for a quiet week would train
      # everyone to ignore this workflow.
      - name: What moved
        id: diff
        run: npm run seo:diff

      # Only when something crossed a threshold. At the thresholds in
      # tools/seo-diff.mjs that is rare by design, so this is a signal
      # rather than a weekly notification nobody reads.
      #
      # An ISSUE, not a comment on the Pulse Log. That issue is the session
      # handoff record `pulse Claude` depends on being readable; weekly bot
      # comments would dilute it.
      - name: Raise it
        if: steps.diff.outputs.material == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly search diff crossed a reporting threshold."
            echo
            echo "Full report: [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "**This is arithmetic, not advice.** Whether any of it should change the site is a"
            echo "judgement with fair-housing, equal-prominence and Ohio advertising constraints on it"
            echo "(CLAUDE.md rules 2, 3, 5, 6), and nothing automated makes that call."
            echo
            echo "Remember the windows overlap by 21 of 28 days — a delta here is not week-over-week."
          } > /tmp/body.md
          gh issue create \
            --title "Search performance moved — $(date -u +%Y-%m-%d)" \
            --body-file /tmp/body.md
