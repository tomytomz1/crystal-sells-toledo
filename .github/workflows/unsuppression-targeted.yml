name: unsuppression-targeted

on:
  push:
    branches:
      - feature/operator-unsuppression-workflow
    paths:
      - api/operator-unsuppress.js
      - api/_lib/operator-unsuppress-token.mjs
      - api/_lib/operator-ledger.mjs
      - api/_lib/consent-ledger.mjs
      - api/_lib/permission.mjs
      - api/_lib/hubspot-consent-state.mjs
      - api/_lib/hubspot.mjs
      - tools/check.mjs
      - tests/operator-unsuppress-*.test.mjs
      - .github/workflows/unsuppression-targeted.yml

permissions:
  contents: write

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operator-unsuppression-workflow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static syntax and project guard
        run: |
          node --check api/operator-unsuppress.js
          node --check api/_lib/operator-unsuppress-token.mjs
          node --check api/_lib/operator-ledger.mjs
          node tools/build-entry.mjs
          node tools/check.mjs
      - name: Targeted tests
        run: node --test tests/operator-unsuppress-token.test.mjs tests/operator-unsuppress-state.test.mjs tests/operator-unsuppress-endpoint.test.mjs
