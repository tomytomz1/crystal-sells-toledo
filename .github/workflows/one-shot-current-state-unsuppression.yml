name: one-shot current-state unsuppression

on:
  push:
    branches:
      - feature/operator-unsuppression-workflow
    paths:
      - .github/workflows/one-shot-current-state-unsuppression.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/operator-unsuppression-workflow
          fetch-depth: 0
      - name: Patch current state
        run: python tools/one-shot-patch-current-state.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT-STATE.md
          git rm .github/workflows/one-shot-current-state-unsuppression.yml
          git rm tools/one-shot-patch-current-state.py
          git commit -m "docs: reconcile unsuppression current state"
          git push origin HEAD:feature/operator-unsuppression-workflow
