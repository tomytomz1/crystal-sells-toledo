<!-- =====================================================================
     SHARED home_value form — the single source of the valuation funnel.
     =====================================================================
     Consumed by BOTH the homepage hero and /home-value. There must never
     be a second copy: the lead contract (form_type, field names, limits,
     step behaviour) lives here once.

     Contains only the form element. Surrounding chrome — headings, cards, hero
     copy — belongs to each page. Context styling is by ancestor selector
     (.hero .hv-form vs .form-card .hv-form), so this markup stays
     unparameterised and cannot drift between the two pages.

     Behaviour comes from assets/js/main.js: initForms() binds any
     form[data-form]; initSteps() binds any [data-steps]. Nothing here is
     homepage-specific.

     The six form-copy tokens below are PRESENTATION COPY ONLY: button labels,
     microcopy, the success wording and the email subject. Field names,
     validation, step behaviour, the honeypot, data-form-type and the
     /api/lead contract are NOT parameterised and must never be. Defaults
     live in tools/build.mjs and reproduce the homepage and /home-value
     wording exactly; a page overrides one only via `formCopy` in its meta
     block, and tools/check.mjs fails the build if the two existing pages
     ever stop rendering the defaults.
     ===================================================================== -->
<div class="form-region" data-form-region>
<noscript>
  <!-- F05. Submission is entirely JavaScript: without it the browser fell
       back to a GET of the current page, which sent no lead, showed no
       confirmation, and put the name, email and property address into the
       address bar. The form is hidden here rather than left submitting, and
       method="post" below means no build of this page can leak fields into a
       URL even if this block is ever removed. -->
  <style>.form-region [data-form] { display: none; }</style>
  <p class="form-noscript">This form needs JavaScript to send your request.
    Please call <a href="tel:+14192454655">(419)&nbsp;245-4655</a> or email
    <a href="mailto:crystal@crystalsellstoledo.com">crystal@crystalsellstoledo.com</a>.</p>
</noscript>
<form class="form hv-form" data-form data-form-type="home_value" data-steps="2"
      data-subject="{{formSubject}}" method="post" novalidate>
  <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

  <p class="form__step" data-step-indicator aria-live="polite">Step 1 of 2</p>

  <!-- Step 1 — address only.
       The one field a valuation cannot be produced without, and a far
       smaller ask than a seven-field form. Steps toggle with the `hidden`
       attribute rather than CSS, so an inactive step leaves the tab order
       and the accessibility tree instead of sitting invisible but
       focusable. With JS off, both steps render and submit in one pass. -->
  <div data-step="1">
    <div class="hv-form__lead">
      <div class="field">
        <label for="v-address">Property address <span class="req" aria-hidden="true">*</span></label>
        <input id="v-address" name="property_address" type="text" autocomplete="street-address"
               placeholder="123 Main St, Perrysburg, OH" maxlength="200" required>
      </div>
      <button class="btn btn--gold btn--lg hv-form__go" type="button" data-step-next>
        {{formStep1Cta}}
      </button>
    </div>

    <p class="form__note hv-form__micro">{{formMicrocopy}}</p>
    <p class="form__note hv-form__privacy"><a href="/privacy">Privacy &amp; terms</a></p>
  </div>

  <!-- Step 2 — contact details -->
  <div data-step="2">
    <div class="form__row">
      <div class="field">
        <label for="v-first">First name <span class="req" aria-hidden="true">*</span></label>
        <input id="v-first" name="first_name" type="text" autocomplete="given-name" required maxlength="40">
      </div>
      <div class="field">
        <label for="v-last">Last name <span class="req" aria-hidden="true">*</span></label>
        <input id="v-last" name="last_name" type="text" autocomplete="family-name" required maxlength="80">
      </div>
    </div>

    <div class="form__row">
      <div class="field">
        <label for="v-email">Email <span class="req" aria-hidden="true">*</span></label>
        <input id="v-email" name="email" type="email" autocomplete="email" required maxlength="100">
      </div>
      <div class="field">
        <label for="v-phone">Phone (optional)</label>
        <input id="v-phone" name="phone" type="tel" autocomplete="tel" placeholder="(419) 000-0000" maxlength="30">
      </div>
    </div>

    <div class="form__row">
      <div class="field">
        <label for="v-timing">When might you sell? (optional)</label>
        <select id="v-timing" name="timeline">
          <option value="">Select&hellip;</option>
          <option>Just curious about the value</option>
          <option>Within 3 months</option>
          <option>3&ndash;6 months</option>
          <option>6&ndash;12 months</option>
          <option>More than a year out</option>
        </select>
      </div>
      <div class="field">
        <label for="v-condition">Overall condition (optional)</label>
        <select id="v-condition" name="condition">
          <option value="">Select&hellip;</option>
          <option>Recently updated throughout</option>
          <option>Well maintained, some updates</option>
          <option>Mostly original finishes</option>
          <option>Needs work</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="v-notes">Anything I should know?</label>
      <textarea id="v-notes" name="notes" maxlength="4000" aria-describedby="v-notes-help"
        placeholder="For example: roof replaced four years ago, finished basement, backs up to the woods, or planning to buy another home after selling."></textarea>
      <p class="field__help" id="v-notes-help">Optional. Up to 4,000 characters.</p>
    </div>

    <div class="form-status" aria-live="polite"></div>

    <button class="btn btn--primary btn--block btn--lg" type="submit">{{formSubmitCta}}</button>

    <button class="btn btn--ghost btn--block" type="button" data-step-back
            style="margin-top:.75rem">Back to address</button>

    <p class="form__note">{{formPrivacy}}</p>
  </div>
</form>

<!-- Success state.
     Replaces the form in place rather than resetting it. Resetting a two-step
     form on success collapsed a tall step 2 back to a short step 1, which
     shrank the document, made the browser clamp the scroll position, and left
     the visitor stranded mid-page - with the confirmation itself hidden,
     because .form-status lives inside step 2.

     Shipped in the SHARED partial so the homepage and /home-value cannot
     drift. Focus moves to the heading, which is why it is tabbable. -->
<div class="success-panel" data-form-success hidden>
  <p class="success-panel__mark" aria-hidden="true">&check;</p>
  <h2 class="success-panel__title" data-success-heading tabindex="-1">{{formSuccessTitle}}</h2>
  <p class="success-panel__lede">{{formSuccessLede}}</p>
  <p class="success-panel__call">If you need to reach her sooner, call
    <a href="tel:+14192454655">(419)&nbsp;245-4655</a>.</p>
</div>
</div>
