<!--
  First-paint performance contract.

  The complete stylesheet is still the single source of truth. On the
  homepage it is not allowed to block the first paint: the small block below
  contains the rules required to render the shared header, dark opening
  surface and homepage valuation form while the immutable full stylesheet
  arrives. Every rule is copied from styles.css on purpose: this is a paint
  bootstrap, not a second design system.

  It covers the homepage's opening viewport ONLY. The stylesheet tag below is
  chosen per page in tools/build.mjs: a short allowlist of conversion pages
  keeps the async load to protect mobile first paint, and every other page
  loads the full stylesheet render-blocking, because a page painted with this
  block alone reflows when the full sheet applies (desktop CLS up to 0.29).
-->

hv-form__lead{display:grid;gap:.85rem}.field{display:grid;gap:.45rem;align-content:start;position:relative}.field>label{font-size:.75rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}.hero .hv-form .field>label{color:rgba(255,255,255,.82)}.field input,.field select,.field textarea{width:100%;padding:.95rem 1.05rem;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);font-size:1rem;color:var(--ink)}.hero .hv-form .field input,.hero .hv-form .field select,.hero .hv-form .field textarea{background:rgba(255,255,255,.97);border-color:rgba(255,255,255,.28)}.hero .hv-form .field input,.hero .hv-form .btn{min-height:3.4rem}.hero .hv-form .btn--primary{background:var(--gold);color:var(--ink)}.hv-form__micro{margin-top:.85rem;font-size:.82rem;letter-spacing:.01em}.hero .hv-form .form__note{color:rgba(255,255,255,.62)}.hero__secondary{margin-top:clamp(1.5rem,3vw,2rem)}.hero__secondary a{font-size:.88rem;color:rgba(255,255,255,.62);border-bottom:1px solid rgba(255,255,255,.22);padding-bottom:.2rem}.pagehead{background:var(--ink);color:rgba(255,255,255,.78);padding-top:clamp(8.5rem,14vw,11rem);padding-bottom:clamp(3.5rem,7vw,5.5rem);position:relative;overflow:hidden}.pagehead h1{color:var(--white);max-width:20ch}.pagehead .eyebrow{color:var(--gold-lt)}.sticky-cta{display:none}
@media(min-width:640px){.hero .hv-form__lead{grid-template-columns:1fr auto;align-items:end;gap:.75rem}.hero .hv-form__go{padding-inline:1.9rem}}@media(max-width:639px){.hero .hv-form__go{width:100%}}@media(min-width:1024px){.hero__grid{grid-template-columns:1.04fr .96fr;gap:clamp(3rem,5vw,5rem);align-items:start}.hero--capture .hero__content{max-width:36rem}}@media(max-width:940px){.nav-toggle{display:block}.nav{position:fixed;inset:0 0 auto 0;top:100%;flex-direction:column;align-items:stretch;gap:0;background:rgba(250,248,245,.985);padding:1rem var(--gutter) 2rem;opacity:0;pointer-events:none}.nav__link{color:var(--ink-soft)!important}}@media(max-width:380px){.hero--capture h1{font-size:1.82rem;margin-bottom:.45em}.hero--capture .eyebrow{margin-bottom:.7rem;font-size:.66rem}.hero--capture .hero__lede{margin-bottom:1.25rem;font-size:.97rem}}

<!-- Keep the branded web fonts out of the critical network race. They are
     optional decoration; system/Georgia fallbacks are metrically stable and
     the existing font-display=optional contract prevents a late LCP repaint. -->
<template id="csv-font-loader">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..500&family=Inter:wght@400..700&display=optional">
</template>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..500&family=Inter:wght@400..700&display=optional"></noscript>

<script>document.documentElement.classList.add("js")</script>
<!-- With JS available the multi-step form will immediately collapse to step 1.
     Hide later steps before first paint so main.js does not cause a large
     layout shift when it initializes them. If JS is disabled, .js is never
     added and both steps remain visible as the no-JS fallback intends. -->
<style>.js form[data-steps]:not([data-current-step]) [data-step]:not([data-step="1"]){display:none}</style>

<!-- GA4 keeps its queue/config available immediately so site events are not
     lost merely because the vendor library is delayed. The large external
     script starts on the first real interaction, when the page is hidden, or
     eight seconds after load as a conservative fallback. -->
<template id="csv-analytics-loader">{{analytics}}</template>
<script>
(function () {
  var template = document.getElementById("csv-analytics-loader");
  if (!template || !template.content) return;
  var scripts = template.content.querySelectorAll("script");
  if (!scripts.length) return;

  var external = null;
  scripts.forEach(function (source) {
    if (source.src || source.getAttribute("src")) { external = source; return; }
    if (!source.textContent.trim()) return;
    var inline = document.createElement("script");
    inline.text = source.textContent;
    document.head.appendChild(inline);
  });
  if (!external) return;

  var started = false;
  function cleanup() {
    ["pointerdown", "keydown", "touchstart"].forEach(function (name) {
      window.removeEventListener(name, start, true);
    });
    document.removeEventListener("visibilitychange", onVisibility);
  }
  function start() {
    if (started) return;
    started = true;
    cleanup();
    var script = document.createElement("script");
    script.async = true;
    script.src = external.getAttribute("src");
    document.head.appendChild(script);
  }
  function onVisibility() { if (document.visibilityState === "hidden") start(); }

  ["pointerdown", "keydown", "touchstart"].forEach(function (name) {
    window.addEventListener(name, start, { capture: true, passive: true, once: true });
  });
  document.addEventListener("visibilitychange", onVisibility);
  window.addEventListener("load", function () { window.setTimeout(start, 8000); }, { once: true });
})();
</script>

<script src="/assets/js/main.js?v={{js_v}}" defer></script>

<!-- Google Places is useful only when a visitor actually uses an address field.
     Keep the build-injected loader inert in a template so its large third-party
     script never enters the critical path for visitors who do not use the form.
     We reproduce only its public readiness contract here; main.js still owns the
     autocomplete behavior itself. -->
<template id="csv-maps-loader">{{mapsLoader}}</template>
<script>
(function () {
  var template = document.getElementById("csv-maps-loader");
  var source = template && template.content
    ? template.content.querySelector("script[src]")
    : null;
  if (!source) return;

  var readyKey = "__csvMaps" + "Ready";
  var resolveKey = "__csvMaps" + "Resolve";
  var rejectKey = "__csvMaps" + "Reject";
  var resolveReady;
  var rejectReady;
  var settled = false;
  var started = false;

  window[readyKey] = new Promise(function (resolve, reject) {
    resolveReady = resolve;
    rejectReady = reject;
  });
  window[resolveKey] = function (value) {
    if (settled) return;
    settled = true;
    resolveReady(value);
  };
  window[rejectKey] = function (error) {
    if (settled) return;
    settled = true;
    rejectReady(error || new Error("Google Maps failed to load"));
  };
  window.csvMapsReady = function () {
    window[resolveKey](true);
    window.setTimeout(function () {
      var active = document.activeElement;
      if (active && active.matches &&
          active.matches('input[name="property_address"]') && active.value) {
        active.dispatchEvent(new Event("input", { bubbles: true }));
      }
    }, 0);
  };

  function cleanup() {
    document.removeEventListener("focusin", maybeStart);
    document.removeEventListener("pointerdown", maybeStart);
  }

  function start() {
    if (started) return;
    started = true;
    cleanup();

    var script = document.createElement("script");
    script.async = true;
    script.src = source.getAttribute("src");
    script.onerror = function () { window[rejectKey](); };
    document.head.appendChild(script);

    window.setTimeout(function () {
      if (!settled) window[rejectKey](new Error("Google Maps timed out"));
    }, 8000);
  }

  function maybeStart(event) {
    var target = event.target;
    if (target && target.matches && target.matches('input[name="property_address"]')) start();
  }

  document.addEventListener("focusin", maybeStart);
  document.addEventListener("pointerdown", maybeStart, { passive: true });
})();
</script>

<!-- Turnstile remains fully enforced server-side, but its third-party runtime
     is not useful until somebody actually starts a lead form. Keep Cloudflare's
     exact documented script inert in a template, expose the same readiness
     promise main.js already expects, and start the vendor download on first
     form interaction. -->
<template id="csv-turnstile-loader">{{turnstileLoader}}</template>
<script>
(function () {
  var template = document.getElementById("csv-turnstile-loader");
  if (!template || !template.content) return;
  var source = template.content.querySelector("script[src]");
  var config = template.content.querySelector("script:not([src])");
  if (!source || !config) return;

  var match = config.textContent.match(/window\.__csvTurnstile\s*=\s*\{\s*sitekey:\s*("[^"]+")\s*\}/);
  if (!match) return;
  var sitekey;
  try { sitekey = JSON.parse(match[1]); } catch (e) { return; }

  var resolveReady;
  var rejectReady;
  var settled = false;
  var started = false;
  window.__csvTurnstile = { sitekey: sitekey };
  window.__csvTurnstileReady = new Promise(function (resolve, reject) {
    resolveReady = resolve;
    rejectReady = reject;
  });
  window.__csvTurnstileResolve = function (value) {
    if (settled) return;
    settled = true;
    resolveReady(value);
  };
  window.__csvTurnstileReject = function (error) {
    if (settled) return;
    settled = true;
    rejectReady(error || new Error("Turnstile failed to load"));
  };
  window.csvTurnstileReady = function () {
    window.__csvTurnstileResolve(window.turnstile);
  };

  function cleanup() {
    document.removeEventListener("focusin", maybeStart);
    document.removeEventListener("pointerdown", maybeStart);
    document.removeEventListener("input", maybeStart);
  }
  function start() {
    if (started) return;
    started = true;
    cleanup();
    var script = document.createElement("script");
    script.async = true;
    script.defer = true;
    script.src = source.getAttribute("src");
    script.onerror = function () { window.__csvTurnstileReject(); };
    document.head.appendChild(script);
    window.setTimeout(function () {
      if (!settled) window.__csvTurnstileReject(new Error("Turnstile timed out"));
    }, 12000);
  }
  function maybeStart(event) {
    var target = event.target;
    if (target && target.closest && target.closest("form[data-form]")) start();
  }

  document.addEventListener("focusin", maybeStart);
  document.addEventListener("pointerdown", maybeStart, { passive: true });
  document.addEventListener("input", maybeStart, { passive: true });
})();
</script>

<!-- Web fonts are deliberately last among nonessential downloads. With
     font-display=optional they enhance a fast connection without being able
     to move the LCP on a slow one. -->
<script>
window.addEventListener("load", function () {
  window.setTimeout(function () {
    var template = document.getElementById("csv-font-loader");
    var link = template && template.content ? template.content.querySelector("link[rel=stylesheet]") : null;
    if (!link) return;
    document.head.appendChild(link.cloneNode(true));
  }, 3000);
}, { once: true });
</script>

<!-- Vercel Web Analytics is useful, but not before the first screen is painted.
     Delay the small same-origin collector alongside the other telemetry. -->
<script>
(function () {
  var started = false;
  function start() {
    if (started) return;
    started = true;
    var s = document.createElement("script");
    s.defer = true;
    s.src = "/_vercel/insights/script.js";
    document.head.appendChild(s);
  }
  window.addEventListener("pointerdown", start, { once: true, passive: true });
  window.addEventListener("keydown", start, { once: true });
  window.addEventListener("load", function () { window.setTimeout(start, 8000); }, { once: true });
})();
</script>
