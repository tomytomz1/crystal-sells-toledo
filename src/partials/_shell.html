{{robots}}

<meta name="author" content="Crystal Saylor | Key Realty LTD">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Crystal Sells Toledo">

<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">{{turnstilePreconnect}}
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Inter is a variable font: 400..700 resolves to the same font files as
     enumerating individual weights. Preload the stylesheet but apply it
     asynchronously so typography cannot hold up the first render/LCP. The
     noscript fallback preserves the intended typography when JS is disabled. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..500&family=Inter:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..500&family=Inter:wght@400..700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..600;1,400..500&family=Inter:wght@400..700&display=swap"></noscript>
<script>document.documentElement.classList.add("js")</script>
<!-- With JS available the multi-step form will immediately collapse to step 1.
     Hide later steps before first paint so main.js does not cause a large
     layout shift when it initializes them. If JS is disabled, .js is never
     added and both steps remain visible as the no-JS fallback intends. -->
<style>.js form[data-steps]:not([data-current-step]) [data-step]:not([data-step="1"]){display:none}</style>
<link rel="stylesheet" href="/assets/css/styles.css?v={{css_v}}">
{{jsonld}}
</head>
<body class="{{bodyClass}}">
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
{{> sticky-cta}}
<script src="/assets/js/main.js?v={{js_v}}" defer></script>
{{mapsLoader}}{{turnstileLoader}}
<!-- Vercel Web Analytics. Cookieless, no personal data, no cross-site
     tracking. Served from Vercel's edge, so it 404s harmlessly when the
     site is run locally. -->
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
