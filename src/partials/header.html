<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="Crystal Sells Toledo — home">
      <img class="brand__logo" src="/assets/img/mark.svg" alt="" width="46" height="46" aria-hidden="true">
      <span class="brand__text">
        <span class="brand__name">Crystal Sells</span>
        <span class="brand__sub">Toledo</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
      <span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span>
    </button>

    <nav class="nav" id="site-nav" aria-label="Main">
      <a class="nav__link" href="/sell"{{nav_sell}}>Sell</a>
      <a class="nav__link" href="/buy"{{nav_buy}}>Buy</a>
      <a class="nav__link" href="/neighborhoods"{{nav_hoods}}>Neighborhoods</a>
      <a class="nav__link" href="/about"{{nav_about}}>About Crystal</a>
      <a class="nav__link" href="/contact"{{nav_contact}}>Contact</a>
      <!-- Overridable per page (headerCta* in tools/build.mjs). A page that
           runs its own funnel should not carry a fixed promotional CTA
           pointing at a different one. Defaults are the site-wide values and
           are pinned in check.mjs. -->
      <a class="nav__cta" href="{{headerCtaHref}}"{{headerCtaData}}>{{headerCtaLabel}}</a>
    </nav>
  </div>
</header>
